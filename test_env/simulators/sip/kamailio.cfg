#!KAMAILIO
#
# Minimal Kamailio 5.x cfg — LAB ONLY. Answers OPTIONS with a Server
# header the recce.services.sip fingerprint normaliser recognises, and
# challenges REGISTER with a Digest realm (so the WWW-Authenticate
# realm is discoverable). Everything else drops with 501.
#
# Deliberately no auth_db / persistence module — the challenge is a
# static reply so no back-end DB is needed, and the sim stays a
# stdlib-Kamailio image.

debug=2
log_stderror=yes
memdbg=5
memlog=5
log_facility=LOG_LOCAL0
fork=yes
children=2
tcp_children=2

# Server banner recce.services.sip's _VENDOR_PATTERNS normaliser
# recognises (Kamailio 5.x → vendor slug "kamailio", version 5.6).
server_header="Server: Kamailio 5.6 (recce-lab)"
user_agent_header="User-Agent: Kamailio 5.6 (recce-lab)"

# Advertised contact host — a private-range name so
# sip_internal_ip_disclosure has something to catch when Kamailio
# generates a Contact for a self-reply.
alias="lab-pbx.recce.test"

# ---- Modules — sl / tm / rr / pv / maxfwd / sanity are all Kamailio
# built-ins with no external deps. auth stays stateless (no auth_db).
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"

# ---- Main routing ----
request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        exit;
    }

    # OPTIONS — the recce probe path. 200 + Server header hits
    # sip_fingerprint's vendor normaliser.
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # REGISTER — hand back a static Digest 401 so the WWW-Authenticate
    # realm surfaces without needing a DB / user table.
    if (is_method("REGISTER")) {
        append_to_reply("WWW-Authenticate: Digest realm=\"recce-lab.internal\", nonce=\"cafebabe0000\", algorithm=MD5\r\n");
        sl_send_reply("401", "Unauthorized");
        exit;
    }

    sl_send_reply("501", "Not Implemented");
    exit;
}
