# cupsd.conf — LAB ONLY. Binds :631 to every interface with no auth
# and the admin UI open. This is the exact posture recce.services.ipp
# is designed to catch.

LogLevel warn
MaxLogSize 0

Port 631
Listen /run/cups/cups.sock

Browsing On
BrowseLocalProtocols dnssd

DefaultAuthType None
WebInterface Yes

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType None
  Order allow,deny
  Allow all
</Location>

# Minimal Policy — one Limit per line so cupsd's parser accepts it.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
