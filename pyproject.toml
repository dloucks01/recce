[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recce"
description = "Multi-subnet enumeration, vulnerability triage & reporting for pentest engagements (stdlib-only, airgapped-friendly)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pentest", "nmap", "enumeration", "reporting", "security"]
dynamic = ["version"]
# Runtime is deliberately stdlib-only (airgapped Kali boxes): no install-time
# dependencies. The tools it shells out to (nmap, netexec, impacket, ...) are
# gated at runtime, not Python packages.
dependencies = []

[project.optional-dependencies]
# The tool itself is stdlib-only; the test suite pulls dev-only packages:
# openpyxl (validate the hand-rolled .xlsx against a real reader), pytest-xdist
# (run the real-nmap fidelity suites across cores - `-n auto`), and fastapi/httpx/
# uvicorn - a meaningful slice of the suite (test_webui*.py, test_dogfood.py,
# test_import_*.py, test_playbook.py, ...) drives the web workbench through
# fastapi's TestClient, which itself needs httpx even though fastapi doesn't
# declare it as a hard dependency. `pip install -e ".[test]"` (what CI's fast job
# runs) previously left these out entirely: 22 failures + 4 collection errors.
test = ["openpyxl", "pytest-xdist", "fastapi", "httpx", "uvicorn"]
# Baked into the airgap bundle (tools/build_bundle.sh installs `.[bundle]`). recce
# still runs without these - it falls back to its hand-rolled clients / CLI tools -
# but bundled they replace the fragile shell-outs with maintained libraries.
bundle = ["impacket", "ldap3", "openpyxl", "fastapi", "uvicorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: the fidelity suites spend their time WAITING on real nmap,
# so spreading them across cores cuts wall-clock dramatically. Needs pytest-xdist
# (in the `test` extra). Drop `-n auto` if running without it.
addopts = "-n auto"
markers = [
    "slow: real-nmap / real-listener high-fidelity test (deselect with -m 'not slow')",
]

[project.scripts]
recce = "recce.cli:main"

[tool.setuptools.dynamic]
version = { attr = "recce.__version__" }

# Auto-discover every subpackage so a `pip install` never quietly ships a
# broken tree again. The previous "packages = ['recce','recce.webui']" list
# was missing 11 real subpackages (recce.cli, recce.act, recce.ad, recce.core,
# recce.intake, recce.report, recce.report.formats, recce.services,
# recce.services.db, recce.services.web, recce.sessions, recce.vuln,
# recce.webui.routes, recce.webui.services) — the shell installed cleanly but
# then ImportError'd on the very first subcommand dispatch.
[tool.setuptools.packages.find]
where = ["."]
include = ["recce*"]
exclude = ["tests*", "tools*", "test_env*", "docs*"]

[tool.setuptools.package-data]
# Ship the bundled demo scan, the on-target enum scripts, the Kali-side
# per-service enumeration suite, and the pre-built webui bundle. Recursive
# globs (**/*) so a new file under scripts/ or webui/static/ doesn't need a
# pyproject edit to reach the wheel.
recce = [
    "sample_scan.xml",
    "local/**/*",
    "scripts/**/*",
    "creds/**/*",
    "data/wordlists/*.txt",   # curated bundled wordlists (paths/creds/users)
    "webui/static/**/*",
    "*.json",              # KEV/EPSS snapshots (refresh_intel drops these)
]
